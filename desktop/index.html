<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScanBridge Desktop</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <div class="eyebrow">ScanBridge</div>
          <h1>Desktop Helper</h1>
        </div>
        <span id="status" class="pill">Loading</span>
      </header>

      <section class="panel">
        <h2>QR Pairing</h2>
        <canvas id="qr"></canvas>
        <p id="pairing-url"></p>
      </section>

      <section class="panel">
        <h2>Connection</h2>
        <dl class="status-grid">
          <div>
            <dt>Relay</dt>
            <dd id="relay-status">Starting</dd>
          </div>
          <div>
            <dt>Mobile</dt>
            <dd id="mobile-status">Waiting scan QR</dd>
          </div>
          <div>
            <dt>Last event</dt>
            <dd id="last-event">-</dd>
          </div>
          <div>
            <dt>Last scan</dt>
            <dd id="last-scan">-</dd>
          </div>
        </dl>
      </section>

      <section class="panel">
        <h2>Settings</h2>
        <label><input id="auto-enter" type="checkbox" /> Auto Enter</label>
        <label><input id="auto-tab" type="checkbox" /> Auto Tab</label>
        <input id="prefix" placeholder="Prefix" />
        <input id="suffix" placeholder="Suffix" />
        <button id="save-settings">Save Settings</button>
      </section>

      <section class="panel">
        <h2>Test Scan</h2>
        <input id="test-barcode" value="8991234567890" />
        <button id="send-test">Type Barcode</button>
        <p id="ack">-</p>
      </section>
    </main>
  </body>
</html>
